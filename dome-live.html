<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sun Field · Live Dome (test)</title>
<meta name="theme-color" content="#07090f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<style>
/* Test page for the live-motion dome. Same look as the app; one full-screen dome with a Live / Freeze button. */
.live-app{height:100%;display:flex;flex-direction:column}
.live-stage{flex:1;position:relative;min-height:0}
.live-bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:var(--surface);border-top:1px solid var(--line)}
.live-btn{border:0;border-radius:12px;padding:13px 22px;font-weight:700;font-size:16px;cursor:pointer;background:var(--accent);color:#1a1205;min-width:150px}
.live-btn[aria-pressed="true"]{background:#3ccf6e;color:#06210f}
.readout{position:absolute;left:0;right:0;top:10px;text-align:center;font-family:var(--mono);font-size:15px;pointer-events:none;text-shadow:0 1px 3px #000}
.readout small{display:block;color:var(--muted);font-family:var(--font);font-size:12px}
.badge{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:10px;font-size:12px;color:var(--muted)}
.err{color:#ff8a7a;font-size:13px;text-align:center;width:100%}
</style>
</head>
<body>
<div class="live-app">
  <header class="top">
    <div class="place"><strong>Live Dome <span class="muted small">test</span></strong><span id="placeLabel" class="muted"></span></div>
    <a class="chip" href="./" style="text-decoration:none">Back to app</a>
  </header>
  <div class="live-stage">
    <canvas id="dome" aria-label="3D sky dome that turns with your phone"></canvas>
    <div class="readout" id="readout">Frozen<small>Tap Live, then move your phone</small></div>
    <button type="button" class="chip layers-btn" id="layersBtn" aria-expanded="false" aria-controls="layerPanel" style="top:56px">Layers</button>
    <div class="layer-panel" id="layerPanel" hidden style="top:98px"></div>
    <div class="badge" id="badge">Drag to spin · pinch to zoom</div>
  </div>
  <div class="live-bar">
    <button type="button" class="live-btn" id="liveBtn" aria-pressed="false">Live motion</button>
    <button type="button" class="chip" id="nowBtn">Now</button>
    <div class="err" id="err" hidden></div>
  </div>
</div>
<script src="sun.js"></script>
<script src="dome.js"></script>
<script src="motion.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = { get(k,d){ try{ const v=localStorage.getItem('sf-'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem('sf-'+k, JSON.stringify(v)); }catch(e){} } };
// shares location, declination and layer choices with the main app
const S = { lat: store.get('lat', 41.8228), lon: store.get('lon', -87.8517), place: store.get('place', 'Brookfield, IL (village center)'),
            decl: store.get('decl', -4.1), tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Chicago' };
$('placeLabel').textContent = S.place;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colors = () => ({fg:cssv('--fg'),muted:cssv('--muted'),line:cssv('--domeline'),ground:cssv('--ground'),path:cssv('--path'),
  season:cssv('--season'),rise:cssv('--rise'),set:cssv('--set'),sun:cssv('--sun'),sunEdge:cssv('--sun-edge'),sunLine:cssv('--path'),
  shadow:cssv('--shadow'),north:cssv('--north'),below:cssv('--below'),font:cssv('--font'),
  altaz:cssv('--altaz'),celes:cssv('--celes'),night:cssv('--nightpath'),halo:cssv('--halo')});
const dome = createDome($('dome'), colors, store.get('domeLayers', {}));
buildLayerPanel($('layerPanel'), dome, l => store.set('domeLayers', l));
$('layersBtn').addEventListener('click', () => { const open = $('layerPanel').hidden; $('layerPanel').hidden = !open; $('layersBtn').setAttribute('aria-expanded', open); });
$('dome').addEventListener('pointerdown', () => { $('layerPanel').hidden = true; $('layersBtn').setAttribute('aria-expanded', false); });

function state(){
  const p={}; new Intl.DateTimeFormat('en-US',{timeZone:S.tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  const [t0,t1] = dayBounds(+p.year,+p.month,+p.day,S.tz);
  return {t: Date.now(), t0, t1, lat:S.lat, lon:S.lon, Y:+p.year, tz:S.tz};
}
dome.draw(state());
$('nowBtn').addEventListener('click', () => dome.draw(state()));
setInterval(() => { if (!live) dome.draw(state()); }, 30000);

// ---- live motion ----
const motion = createMotion({getDecl: () => S.decl});
const DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const wrap = x => ((x % 360) + 540) % 360 - 180;
let live = false, viewYaw = null, viewPitch = null, lastState = 0;
function frame(){
  if (!live) return;
  const f = motion.facing();
  if (f && f.heading != null){
    // gentle smoothing so the dome glides instead of shaking
    const pitch = Math.max(5, Math.min(89, -f.camAlt));
    viewYaw = viewYaw == null ? f.heading : (viewYaw + wrap(f.heading - viewYaw)*0.25 + 360) % 360;
    viewPitch = viewPitch == null ? pitch : viewPitch + (pitch - viewPitch)*0.25;
    if (Date.now() - lastState > 1000){ dome.draw(state()); lastState = Date.now(); }
    dome.setCamera(viewYaw, viewPitch);
    $('readout').innerHTML = `${viewYaw.toFixed(0)}° true ${DIRS[Math.round(viewYaw/22.5)%16]}<small>Live · tilt flat for top view, upright for side view</small>`;
  } else {
    $('readout').innerHTML = `Waiting for compass…<small>Move the phone in a figure 8</small>`;
  }
  requestAnimationFrame(frame);
}
$('liveBtn').addEventListener('click', async () => {
  $('err').hidden = true;
  if (live){
    live = false; $('liveBtn').setAttribute('aria-pressed','false'); $('liveBtn').textContent = 'Live motion';
    const c = dome.getCamera(); $('readout').innerHTML = `Frozen at ${c.yaw.toFixed(0)}° ${DIRS[Math.round(c.yaw/22.5)%16]}<small>Drag to spin · tap Live to follow the phone again</small>`;
    $('badge').hidden = false; return;
  }
  try { await motion.start(); }
  catch(err){ $('err').textContent = err.message || String(err); $('err').hidden = false; return; }
  live = true; viewYaw = null; viewPitch = null;
  $('liveBtn').setAttribute('aria-pressed','true'); $('liveBtn').textContent = 'Freeze'; $('badge').hidden = true;
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
